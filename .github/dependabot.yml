version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"

  - package-ecosystem: "npm"
    directory: "/Anaconda"
    schedule:
      interval: "weekly"
      day: "friday"
    groups:
      babel:
        patterns:
          - "@babel/*"

